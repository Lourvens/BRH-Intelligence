[project]
name = "brh-intelligence"
version = "0.1.0"
description = "Public knowledge platform and MCP server for Haiti's financial and economic information (BRH)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# The repo root is a virtual workspace: it is not itself installable, it
# only anchors the members and the single lockfile.
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "langgraph-cli[inmem]>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "services/agent/tests"]
markers = [
    "integration: tests that need live Postgres / Pinecone / network",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks live in the standalone `experiments/` project (own uv env); ruff
# treats their cells as plain Python and IPython-style indented cells trip it.
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
