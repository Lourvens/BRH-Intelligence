[project]
name = "brh-analytics"
version = "0.1.0"
description = "Stats, charts and social-media assets built on the BRH corpus."
requires-python = ">=3.12"
dependencies = [
    "brh-core",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brh_analytics"]

[tool.uv.sources]
brh-core = { workspace = true }
