[project]
name = "brh-agent"
version = "0.1.0"
description = "BRH Intelligence LangGraph agent — grounded answers with citations."
requires-python = ">=3.12"
dependencies = [
    "brh-core",
    "langgraph>=1.2.17",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langsmith>=0.2",
    "starlette>=0.45",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brh_agent"]

[tool.uv.sources]
brh-core = { workspace = true }
