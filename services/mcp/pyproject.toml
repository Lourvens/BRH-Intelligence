[project]
name = "brh-mcp"
version = "0.1.0"
description = "BRH Intelligence MCP server — trusted BRH document search for AI agents."
requires-python = ">=3.12"
dependencies = [
    "brh-core",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brh_mcp"]

[tool.uv.sources]
brh-core = { workspace = true }
