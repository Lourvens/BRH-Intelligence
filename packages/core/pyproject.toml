[project]
name = "brh-core"
version = "0.1.0"
description = "BRH Intelligence core: domain model, storage, ingestion, and retrieval."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "pinecone>=10.0,<11",
    "openai>=1.40",
    "langchain-core>=1.0",
    "langsmith>=0.2",
    "tokenizers>=0.21",
    "huggingface-hub>=0.30",
    "langchain-openai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brh_core"]
